name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: Build
        run: |
          CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o dist/sinty-hostname ./cmd/sinty-hostname
          CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o dist/sinty-hostnamed ./cmd/sinty-hostnamed
          tar -C dist -czf "sinty-hostname-${GITHUB_REF_NAME}-x86_64.tar.gz" sinty-hostname sinty-hostnamed
      - uses: softprops/action-gh-release@v2
        with:
          files: "*.tar.gz"
